<div aria-labelledby="modal-title" aria-modal="true" class="w-full max-w-[560px] bg-surface-container-lowest ambient-shadow rounded-lg overflow-hidden flex flex-col" role="dialog">
<!-- Header -->
<div class="px-6 py-5 bg-surface border-b border-surface-variant">
<h2 class="text-xl font-bold text-on-surface tracking-tight" id="modal-title">
                    Update PR Status — PR-ABC-21042026-1
                </h2>
</div>
<!-- Body Content -->
<div class="px-6 py-6 flex flex-col gap-6">
<!-- Summary Row -->
<div class="flex items-center gap-4 p-4 bg-surface-container-low rounded-DEFAULT">
<span class="inline-flex items-center px-2.5 py-0.5 rounded text-xs font-semibold bg-tertiary-container text-on-tertiary-container uppercase tracking-wider">
                        CFO REVIEW
                    </span>
<div class="flex items-center gap-2 text-sm text-on-surface-variant">
<span class="material-symbols-outlined text-base">person</span>
<span>Requester: <strong class="text-on-surface font-medium">Sarah Jenkins</strong></span>
</div>
</div>
<!-- Action Radio Group -->
<fieldset>
<legend class="text-sm font-semibold text-on-surface mb-3">Action Required</legend>
<div class="space-y-3">
<!-- Option 1: Approve -->
<label class="relative flex cursor-pointer rounded-DEFAULT p-4 bg-surface-container hover:bg-surface-container-high transition-colors group ghost-border">
<div class="flex items-center h-5">
<input class="h-4 w-4 text-primary border-outline-variant focus:ring-primary focus:ring-offset-surface-container-lowest" name="pr_action" type="radio" value="approve"/>
</div>
<div class="ml-3 flex flex-col">
<span class="block text-sm font-medium text-on-surface group-hover:text-primary transition-colors">Approve</span>
<span class="block text-sm text-on-surface-variant mt-1">Move to next stage</span>
</div>
</label>
<!-- Option 2: Hold -->
<label class="relative flex cursor-pointer rounded-DEFAULT p-4 bg-surface-container hover:bg-surface-container-high transition-colors group ghost-border">
<div class="flex items-center h-5">
<input class="h-4 w-4 text-primary border-outline-variant focus:ring-primary focus:ring-offset-surface-container-lowest" name="pr_action" type="radio" value="hold"/>
</div>
<div class="ml-3 flex flex-col">
<span class="block text-sm font-medium text-on-surface group-hover:text-primary transition-colors">Hold</span>
<span class="block text-sm text-on-surface-variant mt-1">Request additional info</span>
</div>
</label>
<!-- Option 3: Reject -->
<label class="relative flex cursor-pointer rounded-DEFAULT p-4 bg-error-container/20 hover:bg-error-container/40 transition-colors group border border-error-container/50">
<div class="flex items-center h-5">
<input class="h-4 w-4 text-error border-error-container focus:ring-error focus:ring-offset-surface-container-lowest" name="pr_action" type="radio" value="reject"/>
</div>
<div class="ml-3 flex flex-col">
<span class="block text-sm font-medium text-error">Reject</span>
<span class="block text-sm text-on-surface-variant mt-1">Deny request permanently</span>
</div>
</label>
<!-- Option 4: Cancel -->
<label class="relative flex cursor-pointer rounded-DEFAULT p-4 bg-surface-container hover:bg-surface-container-high transition-colors group ghost-border">
<div class="flex items-center h-5">
<input class="h-4 w-4 text-primary border-outline-variant focus:ring-primary focus:ring-offset-surface-container-lowest" name="pr_action" type="radio" value="cancel"/>
</div>
<div class="ml-3 flex flex-col">
<span class="block text-sm font-medium text-on-surface group-hover:text-primary transition-colors">Cancel</span>
<span class="block text-sm text-on-surface-variant mt-1">Close request as void</span>
</div>
</label>
</div>
</fieldset>
<!-- Comments Textarea -->
<div>
<label class="block text-sm font-semibold text-on-surface mb-2" for="comments">Comments</label>
<div class="relative">
<textarea class="block w-full bg-surface-container-lowest border-0 border-b-2 border-outline-variant focus:border-primary focus:ring-0 sm:text-sm text-on-surface placeholder:text-on-surface-variant/50 resize-none transition-colors" id="comments" name="comments" placeholder="Add a reason for this decision — required for reject/hold" rows="3"></textarea>
</div>
</div>
<!-- Checkbox -->
<div class="flex items-start">

<input checked="" class="h-4 w-4 rounded-sm text-primary border-outline-variant focus:ring-primary focus:ring-offset-surface-container-lowest" id="notify_next" name="notify_next" type="checkbox"/>
</div>

</div>
