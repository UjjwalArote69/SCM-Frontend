<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login - SCM</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-tint": "#bf0715",
                        "surface": "#f9f9ff",
                        "surface-bright": "#f9f9ff",
                        "on-background": "#141b2b",
                        "surface-container-high": "#e1e8fd",
                        "on-secondary-fixed-variant": "#86211c",
                        "on-surface-variant": "#5c403c",
                        "on-primary-fixed": "#410002",
                        "secondary-container": "#fd786c",
                        "on-primary-fixed-variant": "#93000b",
                        "on-tertiary": "#ffffff",
                        "surface-variant": "#dce2f7",
                        "primary-fixed-dim": "#ffb4ab",
                        "surface-container-low": "#f1f3ff",
                        "on-secondary": "#ffffff",
                        "on-secondary-fixed": "#410002",
                        "tertiary": "#005e8d",
                        "primary": "#b70011",
                        "inverse-on-surface": "#edf0ff",
                        "error-container": "#ffdad6",
                        "tertiary-container": "#0078b2",
                        "on-secondary-container": "#700f0f",
                        "outline-variant": "#e6bdb8",
                        "on-primary": "#ffffff",
                        "on-error": "#ffffff",
                        "inverse-primary": "#ffb4ab",
                        "tertiary-fixed": "#cbe6ff",
                        "primary-fixed": "#ffdad6",
                        "error": "#ba1a1a",
                        "secondary-fixed-dim": "#ffb4ab",
                        "on-tertiary-fixed": "#001e30",
                        "surface-container-lowest": "#ffffff",
                        "on-error-container": "#93000a",
                        "on-surface": "#141b2b",
                        "primary-container": "#dc2626",
                        "secondary": "#a73831",
                        "on-tertiary-fixed-variant": "#004b71",
                        "surface-container-highest": "#dce2f7",
                        "on-primary-container": "#fff6f5",
                        "background": "#f9f9ff",
                        "outline": "#916f6b",
                        "inverse-surface": "#293040",
                        "on-tertiary-container": "#f3f8ff",
                        "secondary-fixed": "#ffdad6",
                        "surface-dim": "#d3daef",
                        "surface-container": "#e9edff",
                        "tertiary-fixed-dim": "#90cdff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.125rem",
                        "lg": "0.25rem",
                        "xl": "0.5rem",
                        "full": "0.75rem"
                    },
                    "fontFamily": {
                        "headline": ["Inter"],
                        "body": ["Inter"],
                        "label": ["Inter"]
                    }
                },
            },
        }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-surface text-on-surface h-screen w-full flex overflow-hidden">
<div class="hidden lg:flex w-[55%] bg-primary-container flex-col justify-between p-12 relative overflow-hidden">
<div class="absolute inset-0 opacity-10" style="background-image: radial-gradient(circle at 2px 2px, white 1px, transparent 0); background-size: 32px 32px;"></div>
<div class="z-10 flex items-center gap-2">
<span class="material-symbols-outlined text-white text-3xl" style="font-variation-settings: 'FILL' 1;">widgets</span>
<span class="text-white font-black tracking-tighter text-2xl uppercase">SCM</span>
</div>
<div class="z-10 max-w-lg mt-auto mb-32">
<h1 class="text-white text-5xl font-extrabold tracking-tight leading-tight mb-4">Supply Chain, Simplified.</h1>
<p class="text-on-primary-container text-lg font-medium">Streamline operations, optimize logistics, and drive efficiency with absolute precision.</p>
</div>
<div class="z-10">
<p class="text-on-primary-container text-sm font-medium tracking-wide">© Meka Group</p>
</div>
</div>
<div class="w-full lg:w-[45%] bg-surface-container-lowest flex flex-col justify-center items-center p-8 relative">
<div class="w-full max-w-[400px]">
<div class="mb-8 text-center lg:text-left">
<div class="lg:hidden flex items-center justify-center gap-2 mb-8">
<span class="material-symbols-outlined text-primary text-3xl" style="font-variation-settings: 'FILL' 1;">widgets</span>
<span class="text-primary font-black tracking-tighter text-2xl uppercase">SCM</span>
</div>
<h1 class="text-[24px] font-semibold text-on-surface tracking-tight mb-2">Sign in to your account</h1>
<p class="text-on-surface-variant text-sm">Enter your credentials to continue.</p>
</div>
<form class="space-y-5">
<div>
<label class="block text-sm font-medium text-on-surface mb-1" for="email">Email Address</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant text-lg">mail</span>
</div>
<input class="block w-full pl-10 pr-3 py-2 h-[40px] bg-surface-container-lowest border-0 border-b-2 border-outline-variant focus:border-primary focus:ring-0 text-sm text-on-surface transition-colors" id="email" placeholder="name@company.com" type="email"/>
</div>
</div>
<div>
<label class="block text-sm font-medium text-on-surface mb-1" for="password">Password</label>
<div class="relative">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-on-surface-variant text-lg">lock</span>
</div>
<input class="block w-full pl-10 pr-10 py-2 h-[40px] bg-surface-container-lowest border-0 border-b-2 border-outline-variant focus:border-primary focus:ring-0 text-sm text-on-surface transition-colors" id="password" placeholder="••••••••" type="password"/>
<button class="absolute inset-y-0 right-0 pr-3 flex items-center text-on-surface-variant hover:text-on-surface" type="button">
<span class="material-symbols-outlined text-lg">visibility</span>
</button>
</div>
</div>
<div class="flex items-center justify-between mt-4">
<div class="flex items-center">
<input class="h-4 w-4 text-primary focus:ring-primary border-outline-variant rounded DEFAULT" id="remember-me" name="remember-me" type="checkbox"/>
<label class="ml-2 block text-sm text-on-surface-variant" for="remember-me">Remember me</label>
</div>
<div class="text-sm">
<a class="font-medium text-primary hover:text-primary-container underline decoration-1 underline-offset-2" href="#">Forgot password?</a>
</div>
</div>
<div class="pt-2">
<button class="w-full flex justify-center py-2 px-4 border border-transparent rounded-lg shadow-sm text-sm font-medium text-on-primary bg-gradient-to-br from-primary to-primary-container hover:from-primary-container hover:to-primary focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-all h-[40px] items-center" type="button">
                        Sign In
                    </button>
</div>
</form>
<div class="mt-8">
<div class="relative">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant opacity-30"></div>
</div>
<div class="relative flex justify-center text-sm">
<span class="px-2 bg-surface-container-lowest text-on-surface-variant">Are you a vendor?</span>
</div>
</div>
<div class="mt-6">
<button class="w-full flex justify-center py-2 px-4 border border-outline-variant bg-transparent rounded-lg text-sm font-medium text-on-surface hover:bg-surface-container-low focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-primary transition-colors h-[40px] items-center" type="button">
                        Register as Vendor
                    </button>
</div>
</div>
<div class="mt-8 text-center">
<p class="text-sm text-on-surface-variant">
                    Need help? <a class="font-medium text-tertiary hover:text-tertiary-container" href="#">Contact support</a>.
                </p>
</div>
</div>
</div>
</body></html>
