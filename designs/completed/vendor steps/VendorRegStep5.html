<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Vendor Registration Step 5: Business Profile</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
          darkMode: "class",
          theme: {
            extend: {
              "colors": {
                      "on-tertiary": "#ffffff",
                      "inverse-surface": "#293040",
                      "on-tertiary-container": "#f3f8ff",
                      "on-surface-variant": "#5c403c",
                      "on-background": "#141b2b",
                      "on-primary": "#ffffff",
                      "error": "#ba1a1a",
                      "background": "#f9f9ff",
                      "inverse-on-surface": "#edf0ff",
                      "on-error": "#ffffff",
                      "outline": "#916f6b",
                      "tertiary": "#005e8d",
                      "primary-fixed-dim": "#ffb4ab",
                      "surface-tint": "#bf0715",
                      "tertiary-fixed-dim": "#90cdff",
                      "surface-bright": "#f9f9ff",
                      "on-primary-fixed-variant": "#93000b",
                      "surface": "#f9f9ff",
                      "on-secondary-fixed": "#410002",
                      "surface-container-low": "#f1f3ff",
                      "surface-dim": "#d3daef",
                      "secondary": "#a73831",
                      "error-container": "#ffdad6",
                      "primary-container": "#dc2626",
                      "tertiary-container": "#0078b2",
                      "on-primary-container": "#fff6f5",
                      "on-surface": "#141b2b",
                      "on-tertiary-fixed": "#001e30",
                      "secondary-container": "#fd786c",
                      "surface-container-lowest": "#ffffff",
                      "tertiary-fixed": "#cbe6ff",
                      "surface-variant": "#dce2f7",
                      "on-tertiary-fixed-variant": "#004b71",
                      "on-secondary": "#ffffff",
                      "secondary-fixed": "#ffdad6",
                      "on-error-container": "#93000a",
                      "surface-container-highest": "#dce2f7",
                      "on-secondary-container": "#700f0f",
                      "on-secondary-fixed-variant": "#86211c",
                      "primary-fixed": "#ffdad6",
                      "outline-variant": "#e6bdb8",
                      "surface-container-high": "#e1e8fd",
                      "secondary-fixed-dim": "#ffb4ab",
                      "primary": "#b70011",
                      "inverse-primary": "#ffb4ab",
                      "on-primary-fixed": "#410002",
                      "surface-container": "#e9edff"
              },
              "borderRadius": {
                      "DEFAULT": "0.125rem",
                      "lg": "0.25rem",
                      "xl": "0.5rem",
                      "full": "0.75rem"
              },
              "spacing": {},
              "fontFamily": {
                      "headline": ["Inter", "sans-serif"],
                      "body": ["Inter", "sans-serif"],
                      "label": ["Inter", "sans-serif"]
              }
            },
          },
        }
      </script>
<style>
          body {
              background-color: theme('colors.black');
              color: theme('colors.black');
              font-family: theme('fontFamily.mono');
          }
          .material-symbols-outlined {
              font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
          }
      </style>
</head>
<body class="min-h-screen bg-background text-on-background pb-32">
<!-- TopNavBar (SCM_ARCHITECT) -->
<nav class="fixed top-0 w-full h-16 bg-slate-50 dark:bg-slate-900 border-b border-slate-200/20 z-50">
<div class="flex items-center justify-between px-8 w-full h-full bg-slate-100 dark:bg-slate-800">
<div class="flex items-center gap-8">
<span class="font-sans tracking-tight text-sm uppercase font-bold text-red-700 dark:text-red-500">SCM_ARCHITECT</span>
</div>
<div class="flex items-center gap-6">
<!-- Navigation Tabs Suppressed for Transactional Flow -->
<button class="font-sans tracking-tight text-sm uppercase font-bold text-slate-500 dark:text-slate-400 hover:text-red-600 transition-colors duration-200 scale-95 active:opacity-80 transition-transform">
                    Sign in
                </button>
</div>
</div>
</nav>
<!-- Main Content Canvas -->
<main class="pt-24 px-6 md:px-12 flex justify-center">
<div class="w-full max-w-[840px]">
<!-- Header Section -->
<header class="mb-12">
<h1 class="font-headline text-3xl font-extrabold text-on-background tracking-tight mb-2">Business Profile</h1>
<p class="font-body text-sm text-on-surface-variant font-medium">Help us understand your business scale and expertise.</p>
</header>
<!-- Stepper Component -->
<div class="mb-12">
<div class="flex items-center justify-between w-full relative">
<!-- Step 1 (Completed) -->
<div class="flex flex-col items-center relative z-10 w-1/6">
<div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center mb-2">
<span class="material-symbols-outlined text-on-primary text-sm font-bold" data-weight="fill" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
</div>
<!-- Connector 1-2 -->
<div class="absolute top-4 left-[8.33%] w-[16.66%] h-[2px] bg-primary -z-10"></div>
<!-- Step 2 (Completed) -->
<div class="flex flex-col items-center relative z-10 w-1/6">
<div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center mb-2">
<span class="material-symbols-outlined text-on-primary text-sm font-bold" data-weight="fill" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
</div>
<!-- Connector 2-3 -->
<div class="absolute top-4 left-[25%] w-[16.66%] h-[2px] bg-primary -z-10"></div>
<!-- Step 3 (Completed) -->
<div class="flex flex-col items-center relative z-10 w-1/6">
<div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center mb-2">
<span class="material-symbols-outlined text-on-primary text-sm font-bold" data-weight="fill" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
</div>
<!-- Connector 3-4 -->
<div class="absolute top-4 left-[41.66%] w-[16.66%] h-[2px] bg-primary -z-10"></div>
<!-- Step 4 (Completed) -->
<div class="flex flex-col items-center relative z-10 w-1/6">
<div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center mb-2">
<span class="material-symbols-outlined text-on-primary text-sm font-bold" data-weight="fill" style="font-variation-settings: 'FILL' 1;">check</span>
</div>
</div>
<!-- Connector 4-5 -->
<div class="absolute top-4 left-[58.33%] w-[16.66%] h-[2px] bg-primary -z-10"></div>
<!-- Step 5 (Active) -->
<div class="flex flex-col items-center relative z-10 w-1/6">
<div class="w-8 h-8 rounded-full bg-primary flex items-center justify-center mb-2 ring-4 ring-primary-container/30">
<span class="font-label text-sm text-on-primary font-bold">5</span>
</div>
<span class="font-label text-xs text-on-background font-semibold absolute top-10 whitespace-nowrap">Step 5 of 6</span>
</div>
<!-- Connector 5-6 -->
<div class="absolute top-4 left-[75%] w-[16.66%] h-[2px] bg-surface-variant -z-10"></div>
<!-- Step 6 (Grey) -->
<div class="flex flex-col items-center relative z-10 w-1/6">
<div class="w-8 h-8 rounded-full bg-surface-variant flex items-center justify-center mb-2">
<span class="font-label text-sm text-on-surface-variant font-medium">6</span>
</div>
</div>
</div>
</div>
<!-- Form Container -->
<div class="bg-surface-container-low p-8 pt-10 grid grid-cols-1 md:grid-cols-2 gap-x-8 gap-y-10 relative overflow-hidden">
<!-- Decorative Layering element -->
<div class="absolute top-0 left-0 w-1 h-full bg-tertiary"></div>
<!-- Field 1: Year of establishment -->
<div class="flex flex-col gap-2">
<label class="font-label text-sm font-semibold text-on-surface-variant" for="establishment-year">Year of establishment</label>
<div class="relative">
<input class="w-full bg-surface-container-lowest border-0 border-b-2 border-outline-variant focus:border-primary focus:ring-0 text-on-background font-body text-base py-3 px-4 transition-colors duration-200" id="establishment-year" type="date"/>
</div>
</div>
<!-- Field 2: Nature of business -->
<div class="flex flex-col gap-2">
<label class="font-label text-sm font-semibold text-on-surface-variant" for="business-nature">Nature of business</label>
<div class="relative">
<select class="w-full bg-surface-container-lowest border-0 border-b-2 border-outline-variant focus:border-primary focus:ring-0 text-on-background font-body text-base py-3 px-4 appearance-none transition-colors duration-200" id="business-nature">
<option disabled="" selected="" value="">Select nature</option>
<option value="manufacturing">Manufacturing</option>
<option value="trading">Trading</option>
<option value="services">Services</option>
<option value="distribution">Distribution</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]" data-icon="arrow_drop_down">arrow_drop_down</span>
</div>
</div>
</div>
<!-- Field 3: Annual turnover -->
<div class="flex flex-col gap-2">
<label class="font-label text-sm font-semibold text-on-surface-variant" for="annual-turnover">Annual turnover</label>
<div class="relative">
<select class="w-full bg-surface-container-lowest border-0 border-b-2 border-outline-variant focus:border-primary focus:ring-0 text-on-background font-body text-base py-3 px-4 appearance-none transition-colors duration-200" id="annual-turnover">
<option disabled="" selected="" value="">Select range</option>
<option value="&lt;1cr">&lt; 1 Cr</option>
<option value="1-5cr">1 - 5 Cr</option>
<option value="5-20cr">5 - 20 Cr</option>
<option value="&gt;20cr">&gt; 20 Cr</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]" data-icon="arrow_drop_down">arrow_drop_down</span>
</div>
</div>
</div>
<!-- Field 4: Number of employees -->
<div class="flex flex-col gap-2">
<label class="font-label text-sm font-semibold text-on-surface-variant" for="employee-count">Number of employees</label>
<div class="relative">
<select class="w-full bg-surface-container-lowest border-0 border-b-2 border-outline-variant focus:border-primary focus:ring-0 text-on-background font-body text-base py-3 px-4 appearance-none transition-colors duration-200" id="employee-count">
<option disabled="" selected="" value="">Select range</option>
<option value="1-10">1 - 10</option>
<option value="11-50">11 - 50</option>
<option value="51-200">51 - 200</option>
<option value="201+">201+</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-4 text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]" data-icon="arrow_drop_down">arrow_drop_down</span>
</div>
</div>
</div>
<!-- Field 5: Key products/services -->
<div class="flex flex-col gap-2 md:col-span-2 mt-4">
<label class="font-label text-sm font-semibold text-on-surface-variant" for="key-products">Key products/services</label>
<textarea class="w-full bg-surface-container-lowest border-0 border-b-2 border-outline-variant focus:border-primary focus:ring-0 text-on-background font-body text-base py-3 px-4 transition-colors duration-200 resize-y" id="key-products" placeholder="Describe your main offerings..." rows="3"></textarea>
</div>
<!-- Field 6: Major clients -->
<div class="flex flex-col gap-2 md:col-span-2 mt-2">
<label class="font-label text-sm font-semibold text-on-surface-variant" for="major-clients">Major clients</label>
<textarea class="w-full bg-surface-container-lowest border-0 border-b-2 border-outline-variant focus:border-primary focus:ring-0 text-on-background font-body text-base py-3 px-4 transition-colors duration-200 resize-y" id="major-clients" placeholder="List key clients or partners..." rows="3"></textarea>
</div>
</div>
</div>
</main>
<!-- Footer -->
<footer class="fixed bottom-0 w-full border-t border-slate-200/20 shadow-[0_-4px_20px_rgba(0,0,0,0.05)] bg-slate-50 dark:bg-slate-900 z-50">
<div class="flex justify-between items-center px-12 py-6 w-full max-w-screen-2xl mx-auto bg-white dark:bg-slate-950">
<!-- Left side copyright/progress text from JSON -->
<div class="font-sans text-xs uppercase tracking-widest font-semibold text-red-700 dark:text-red-500">
                Step 1 of 6 <!-- As requested in JSON, though page intent says 5 of 6. Following JSON strictness for the anchor element content -->
</div>
<div class="flex gap-4">
<!-- Back Link -->
<button class="font-sans text-xs uppercase tracking-widest font-semibold text-slate-400 border border-slate-200 dark:border-slate-800 px-6 py-2 rounded-md hover:bg-slate-100 dark:hover:bg-slate-800 hover:brightness-110 transition-all duration-300 active:scale-98">
                    Back
                </button>
<!-- Save & Continue Link (Active CTA) -->
<button class="font-sans text-xs uppercase tracking-widest font-semibold bg-gradient-to-br from-red-700 to-red-500 text-white px-6 py-2 rounded-md shadow-lg hover:brightness-110 transition-all duration-300 active:scale-98">
                    Save &amp; Continue
                </button>
</div>
</div>
</footer>
</body></html>
